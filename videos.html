    <!--
      COMO ADICIONAR VÍDEOS:
      1. Coloca o ficheiro .mp4 em videos/
      2. Copia um bloco .video-card e ajusta título, data e src do <video>
      3. Se o vídeo for grande, considera hospedá-lo fora do repositório
         e usar aqui o link externo (ver secção 25 do plano)
    -->

    <div class="videos-grid revelar">
      <div class="video-card">
        <video controls preload="none" poster="">
          <source src="videos/video01.mp4" type="video/mp4">
        </video>
        <div class="video-info">
          <div class="video-titulo">Nosso primeiro vídeo</div>
          <div class="video-data">DD/MM/AAAA</div>
        </div>
      </div>
    </div>
  </section>
